name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify custom domain serves current map-first release
        shell: bash
        run: |
          set -euo pipefail
          HOME_URL="https://tcwine.chrisizworski.com/"
          FOOD_URL="https://tcwine.chrisizworski.com/traverse-city-wineries-with-food"
          ok=0

          for attempt in $(seq 1 12); do
            stamp="$(date +%s)-${attempt}"
            home="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${HOME_URL}?smoke=${stamp}" || true)"
            food="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${FOOD_URL}?smoke=${stamp}" || true)"

            # PlannerMount uses dynamic(..., { ssr: false }), so My Wine Day is
            # intentionally client-rendered and cannot be asserted from curl HTML.
            if grep -q "Traverse City Winery Map" <<<"$home" \
              && grep -q "40 Wineries" <<<"$home" \
              && grep -q "Traverse City Wineries With Food" <<<"$food"; then
              ok=1
              echo "Production custom domain is serving the current map-first release."
              break
            fi

            echo "Attempt ${attempt}: production content has not converged yet."
            sleep 10
          done

          if [[ "$ok" != "1" ]]; then
            echo "::error::tcwine.chrisizworski.com did not serve the expected current release markers."
            echo "Homepage title marker:"
            grep -o "Traverse City[^<]*" <<<"$home" | head -5 || true
            exit 1
          fi

          publisher_ok=0
          for attempt in $(seq 1 12); do
            stamp="$(date +%s)-publisher-${attempt}"
            publisher_url="https://tcwine.chrisizworski.com/for-publishers?smoke=${stamp}"
            embed_url="https://tcwine.chrisizworski.com/embed/traverse-city-winery-map?smoke=${stamp}"
            publisher="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$publisher_url" || true)"
            embed="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$embed_url" || true)"
            publisher_headers="$(curl -fsSI --max-time 20 -H 'Cache-Control: no-cache' "$publisher_url" 2>/dev/null | tr -d '\r' || true)"
            embed_headers="$(curl -fsSI --max-time 20 -H 'Cache-Control: no-cache' "$embed_url" 2>/dev/null | tr -d '\r' || true)"

            if grep -q "Use the Traverse City Winery Map on your site" <<<"$publisher" \
              && grep -q "Traverse City Winery Map Embed" <<<"$embed" \
              && grep -qi '^x-robots-tag: noindex, follow' <<<"$publisher_headers" \
              && grep -qi '^x-robots-tag: noindex, follow' <<<"$embed_headers"; then
              publisher_ok=1
              echo "Publisher authority surfaces are live and noindex."
              break
            fi

            echo "Attempt ${attempt}: publisher authority surfaces have not converged yet."
            sleep 10
          done

          if [[ "$publisher_ok" != "1" ]]; then
            echo "::error::Publisher authority surfaces did not converge on the custom domain."
            echo "Publisher identity present: $(grep -q "Use the Traverse City Winery Map on your site" <<<"$publisher" && echo yes || echo no)"
            echo "Embed identity present: $(grep -q "Traverse City Winery Map Embed" <<<"$embed" && echo yes || echo no)"
            echo "Publisher X-Robots-Tag: $(grep -i '^x-robots-tag:' <<<"$publisher_headers" | head -1 || true)"
            echo "Embed X-Robots-Tag: $(grep -i '^x-robots-tag:' <<<"$embed_headers" | head -1 || true)"
            exit 1
          fi

          authority_ok=0
          for attempt in $(seq 1 12); do
            stamp="$(date +%s)-authority-${attempt}"
            partner_url="https://tcwine.chrisizworski.com/embed/partner/grand-traverse-resort?smoke=${stamp}"
            compare_url="https://tcwine.chrisizworski.com/old-mission-vs-leelanau-wineries?smoke=${stamp}"
            data_url="https://tcwine.chrisizworski.com/api/publisher/driving-reality.json?smoke=${stamp}"

            partner="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$partner_url" || true)"
            compare="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$compare_url" || true)"
            data="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$data_url" || true)"
            partner_headers="$(curl -fsSI --max-time 20 -H 'Cache-Control: no-cache' "$partner_url" 2>/dev/null | tr -d '\r' || true)"
            data_headers="$(curl -fsSI --max-time 20 -H 'Cache-Control: no-cache' "$data_url" 2>/dev/null | tr -d '\r' || true)"

            if grep -q "Plan wine country from Grand Traverse Resort" <<<"$partner" \
              && grep -q "Old Mission vs. Leelanau: the driving reality" <<<"$compare" \
              && grep -q '"medianPairMiles"' <<<"$data" \
              && grep -qi '^x-robots-tag: noindex, follow' <<<"$partner_headers" \
              && grep -qi '^x-robots-tag: noindex, follow' <<<"$data_headers"; then
              authority_ok=1
              echo "Partner embeds and driving-reality data asset are live."
              break
            fi

            echo "Attempt ${attempt}: partner/data authority surfaces have not converged yet."
            sleep 10
          done

          if [[ "$authority_ok" != "1" ]]; then
            echo "::error::Partner embed or driving-reality production contract failed."
            echo "Partner identity present: $(grep -q "Plan wine country from Grand Traverse Resort" <<<"$partner" && echo yes || echo no)"
            echo "Driving analysis present: $(grep -q "Old Mission vs. Leelanau: the driving reality" <<<"$compare" && echo yes || echo no)"
            echo "Data metric present: $(grep -q '"medianPairMiles"' <<<"$data" && echo yes || echo no)"
            echo "Partner X-Robots-Tag: $(grep -i '^x-robots-tag:' <<<"$partner_headers" | head -1 || true)"
            echo "Data X-Robots-Tag: $(grep -i '^x-robots-tag:' <<<"$data_headers" | head -1 || true)"
            exit 1
          fi
