name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify custom domain serves current map-first release
        shell: bash
        run: |
          set -euo pipefail
          HOME_URL="https://tcwine.chrisizworski.com/"
          FOOD_URL="https://tcwine.chrisizworski.com/traverse-city-wineries-with-food"
          ok=0

          for attempt in $(seq 1 12); do
            stamp="$(date +%s)-${attempt}"
            home="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${HOME_URL}?smoke=${stamp}" || true)"
            food="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${FOOD_URL}?smoke=${stamp}" || true)"

            # PlannerMount uses dynamic(..., { ssr: false }), so My Wine Day is
            # intentionally client-rendered and cannot be asserted from curl HTML.
            if grep -q "Traverse City Winery Map" <<<"$home" \
              && grep -q "40 Wineries" <<<"$home" \
              && grep -q "Traverse City Wineries With Food" <<<"$food"; then
              ok=1
              echo "Production custom domain is serving the current map-first release."
              break
            fi

            echo "Attempt ${attempt}: production content has not converged yet."
            sleep 10
          done

          if [[ "$ok" != "1" ]]; then
            echo "::error::tcwine.chrisizworski.com did not serve the expected current release markers."
            echo "Homepage title marker:"
            grep -o "Traverse City[^<]*" <<<"$home" | head -5 || true
            exit 1
          fi

          stamp="$(date +%s)-publisher"
          publisher_url="https://tcwine.chrisizworski.com/for-publishers?smoke=${stamp}"
          embed_url="https://tcwine.chrisizworski.com/embed/traverse-city-winery-map?smoke=${stamp}"
          publisher="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$publisher_url")"
          embed="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$embed_url")"
          publisher_headers="$(curl -fsSI --max-time 20 -H 'Cache-Control: no-cache' "$publisher_url" | tr -d '\r')"
          embed_headers="$(curl -fsSI --max-time 20 -H 'Cache-Control: no-cache' "$embed_url" | tr -d '\r')"

          grep -q "Use the Traverse City Winery Map on your site" <<<"$publisher"
          grep -q "43 current winery/tasting-room locations" <<<"$publisher"
          grep -q "43 mapped winery/tasting-room locations" <<<"$embed"
          grep -qi '^x-robots-tag: noindex, follow' <<<"$publisher_headers"
          grep -qi '^x-robots-tag: noindex, follow' <<<"$embed_headers"

          echo "Publisher authority surfaces are live and noindex."
