name: Food evidence freshness (no deploy)
on:
  schedule:
    - cron: "15 13 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Flag expired source records and unresolved hour conflicts
        run: node scripts/audit-food-freshness.mjs
